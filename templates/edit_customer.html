{% include 'header.html' %}

<div class="dashboard-container">

    <div class="dashboard-header">
        <h1>Edit Customer</h1>
        <p>Update customer details.</p>
    </div>

    <div class="profile-card">

        <form method="POST">

            <div class="input-group">
                <label>Customer Name</label>
                <input type="text"
                       name="customer_name"
                       value="{{ customer.customer_name }}"
                       required>
            </div>

            <div class="input-group">
                <label>Mobile</label>
                <input type="text"
                       name="mobile"
                       value="{{ customer.mobile }}"
                       required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email"
                       name="email"
                       value="{{ customer.email }}">
            </div>

            <div class="input-group">
                <label>Address</label>
                <textarea name="address">{{ customer.address }}</textarea>
            </div>

            <div class="input-group">
                <label>GST Number</label>
                <input type="text"
                       name="gst_number"
                       value="{{ customer.gst_number }}">
            </div>

            <br>

            <button type="submit" class="login-btn">
                Update Customer
            </button>

        </form>

    </div>

</div>

{% include 'footer.html' %}
