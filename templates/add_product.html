{% include 'header.html' %}

<div class="dashboard-container">

    <div class="dashboard-header">

        <h1>Add Product</h1>

        <p>Add a new product to your inventory.</p>

    </div>


    <div class="profile-card">

        <form action="{{ url_for('products.add_product') }}" 
              method="POST" 
              enctype="multipart/form-data">


            <div class="input-group">

                <input
                    type="text"
                    name="name"
                    placeholder="Product Name"
                    required>

            </div>


            <div class="input-group">

                <input
                    type="text"
                    name="category"
                    placeholder="Category"
                    required>

            </div>


            <div class="input-group">

                <textarea
                    name="description"
                    placeholder="Description"
                    rows="4"></textarea>

            </div>


            <div class="input-group">

                <input
                    type="number"
                    step="0.01"
                    name="purchase_price"
                    placeholder="Purchase Price"
                    required>

            </div>


            <div class="input-group">

                <input
                    type="number"
                    step="0.01"
                    name="selling_price"
                    placeholder="Selling Price"
                    required>

            </div>


            <div class="input-group">

                <input
                    type="number"
                    name="quantity"
                    placeholder="Stock Quantity"
                    required>

            </div>


            <div class="input-group">

                <label>
                    Product Image
                </label>

                <input
                    type="file"
                    name="image"
                    accept="image/*">

            </div>


            <button type="submit" class="login-btn">

                Save Product

            </button>


        </form>

    </div>

</div>


{% include 'footer.html' %}
